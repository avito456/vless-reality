[project]
name = "xrayadm"
version = "0.1.0"
description = "CLI for managing Xray VLESS+Reality clients over SSH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "qrcode>=7.4"]

[project.scripts]
xrayadm = "xrayadm.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xrayadm"]
